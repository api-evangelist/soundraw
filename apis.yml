description: >-
  SOUNDRAW is an AI music generation platform that produces royalty-free,
  copyright-cleared music customized by genre, mood, theme, length, and
  instrumentation. Beyond the soundraw.io consumer product, SOUNDRAW
  offers a B2B API for embedding music generation into video platforms,
  games, social tools, and ad tech, with Canva, Filmora, and Captions
  Mirage cited as integration partners.
apis:
  - aid: soundraw:music-api
    name: SOUNDRAW API
    description: >-
      B2B HTTP API for generating royalty-free AI music at scale, supporting
      per-end-user music creation with style, mood, genre, length, and
      instrument customization. Generated tracks are cleared for perpetual
      commercial use. Documentation and base URL are issued to API
      customers; access starts at the Starter tier ($29.99/mo, up to 100
      songs) and scales to Pro and custom Enterprise plans.
    humanURL: https://soundraw.io/api
